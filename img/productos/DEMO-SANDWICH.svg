  <path d="M75,108 L78,118 L83,108 Z" fill="#ffd54f"/>
  <!-- Tomates frescos rodajas -->
  <rect x="50" y="94" width="30" height="9" rx="4" fill="#e53935"/>
  <rect x="90" y="93" width="32" height="9" rx="4" fill="#e53935"/>
  <rect x="130" y="94" width="25" height="9" rx="4" fill="#e53935"/>
  <!-- Pan superior baguette / ciabatta dorado -->
  <path d="M35,92 C35,62 70,55 100,55 C130,55 165,62 165,92 C165,98 140,100 100,100 C60,100 35,98 35,92 Z" fill="url(#panSandwich)"/>
  <!-- Cortes rústicos en la corteza -->
  <line x1="60" y1="70" x2="72" y2="85" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="66" x2="105" y2="83" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="70" x2="138" y2="85" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
</svg>