<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="panSandwich" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="170" rx="70" ry="14" fill="#000000" opacity="0.14"/>
  <!-- Pan inferior -->
  <path d="M35,135 C35,130 50,125 100,125 C150,125 165,130 165,135 C165,150 145,158 100,158 C55,158 35,150 35,135 Z" fill="#d7ccc8"/>
  <!-- Relleno: Lechuga ondulada verde -->
